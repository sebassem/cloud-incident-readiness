name: 🐞 Subscription
description: Request a new Azure Subscription
title: "<Project name>"
body:
- type: input
  id: displayName
  attributes:
    label: Subscription display name
    description: "What will be the display name of the subscription?"
    placeholder: "ex. sub-nexus-project-prod"
  validations:
    required: true
- type: dropdown
  id: virtualNetworkEnabled
  attributes:
    label: Deploy a virtual network?
    description: "Option to deploy a virtual network into the new subscription."
    options:
      - No (Default)
      - "Yes"
  validations:
    required: true
- type: textarea
  id: virtualNetworkAddressSpace
  attributes:
    label: Virtual network address spaces
    description: "The address spaces for the virtual network to be created."
    placeholder: "ex. [10.0.0.0/16]"
  validations:
    required: false
- type: dropdown
  id: virtualNetworkPeeringEnabled
  attributes:
    label: Enable virtual network peering
    description: "Option to peer the new virtual network with the platform's hub network."
    options:
      - No (Default)
      - "Yes"
    default: 0
  validations:
    required: false
- type: textarea
  attributes:
    label: Environment
    description: |
      examples:
        - **OS**: Ubuntu 20.04
        - **Node**: 13.14.0
        - **npm**: 7.6.3
    value: |
        - OS:
        - Node:
        - npm:
    render: markdown
  validations:
    required: false
- type: textarea
  attributes:
    label: Anything else?
    description: |
      Links? References? Anything that will give us more context about the issue you are encountering!

      Tip: You can attach images or log files by clicking this area to highlight it and then dragging files in.
  validations:
    required: false
