name: 🐞 Subscription
description: Request a new Azure Subscription
title: "<Project name>"
body:
- type: input
  id: displayName
  attributes:
    label: Subscription display name
    description: "What will be the display name of the subscription?"
    placeholder: "ex. sub-nexus-project-prod"
  validations:
    required: true
- type: dropdown
  id: virtualNetworkEnabled
  attributes:
    label: Deploy a virtual network?
    description: "Option to deploy a virtual network into the new subscription."
    options:
      - No (Default)
      - Yes (Default)
  validations:
    required: true
- type: textarea
  attributes:
    label: Expected Behavior
    description: A concise description of what you expected to happen.
  validations:
    required: false
- type: textarea
  attributes:
    label: Steps To Reproduce
    description: Steps to reproduce the behavior.
    placeholder: |
      1. In this environment...
      1. With this config...
      1. Run '...'
      1. See error...
  validations:
    required: false
- type: textarea
  attributes:
    label: Environment
    description: |
      examples:
        - **OS**: Ubuntu 20.04
        - **Node**: 13.14.0
        - **npm**: 7.6.3
    value: |
        - OS:
        - Node:
        - npm:
    render: markdown
  validations:
    required: false
- type: textarea
  attributes:
    label: Anything else?
    description: |
      Links? References? Anything that will give us more context about the issue you are encountering!

      Tip: You can attach images or log files by clicking this area to highlight it and then dragging files in.
  validations:
    required: false
