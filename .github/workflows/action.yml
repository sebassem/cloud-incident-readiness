name: Deploy to Azure
on:
  issues:
    types: [closed]
permissions:
  id-token: write
  contents: read
jobs:
  ParseSubscriptionProperties:
    runs-on: ubuntu-latest
    steps:
      - uses: stefanbuck/github-issue-parser@v3
        id: issue-parser
        with:
          template-path: .github/ISSUE_TEMPLATE/newSub.yml

      - run: cat ${HOME}/issue-parser-result.json

      - run: echo "Fetching subscription properties."
        env:
          displayName: ${{ steps.issue-parser.outputs.issueparser_subscription_display_name }}
          virtualNetworkEnabled: ${{ steps.issue-parser.outputs.issueparser_deploy_a_virtual_network }}
          virtualNetworkAddressSpace: ${{ steps.issue-parser.outputs.issueparser_virtual_network_address_spaces }}
          virtualNetworkPeeringEnabled: ${{ steps.issue-parser.outputs.issueparser_enable_virtual_network_peering }}
          hubNetworkResourceId: ${{ steps.issue-parser.outputs.issueparser_hub_network_resource_id }}
    outputs:
            displayName: ${{ steps.issue-parser.outputs.issueparser_subscription_display_name }}
            virtualNetworkEnabled: ${{ steps.issue-parser.outputs.issueparser_deploy_a_virtual_network }}
            virtualNetworkAddressSpace: ${{ steps.issue-parser.outputs.issueparser_virtual_network_address_spaces }}
            virtualNetworkPeeringEnabled: ${{ steps.issue-parser.outputs.issueparser_enable_virtual_network_peering }}
            hubNetworkResourceId: ${{ steps.issue-parser.outputs.issueparser_hub_network_resource_id }}

  DeployToAzure:
    runs-on: ubuntu-latest
    needs: ParseSubscriptionProperties
    steps:
      - name: "Run az commands"
        env:
          displayName: ${{ needs.ParseSubscriptionProperties.outputs.displayName }}
        run: |
         echo "Display Name: $displayName"
